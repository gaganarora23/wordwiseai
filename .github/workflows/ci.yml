name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wordwise
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: wordwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordwise -d wordwise"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://wordwise:ci-password@localhost:5432/wordwise
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - name: Install backend dependencies
        run: cd backend && uv sync --frozen
      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile
      - name: Run all tests
        run: make test
