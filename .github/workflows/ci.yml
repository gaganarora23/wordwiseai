name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wordwise
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: wordwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordwise -d wordwise"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://wordwise:ci-password@localhost:5432/wordwise
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install backend dependencies
        run: cd backend && uv sync --frozen
      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile
      - name: Run all tests
        run: make test

  deploy:
    # Runs only after `test` passes, and only for pushes to main (never for pull requests).
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy (API)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_API is not set; skipping the API deploy."
            exit 0
          fi
          body=$(curl --fail --silent --show-error -X POST "$HOOK")
          echo "API deploy triggered: $(echo "$body" | grep -o 'dep-[A-Za-z0-9]*' | head -n 1)"
      - name: Trigger Render deploy (web)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_WEB is not set; skipping the web deploy."
            exit 0
          fi
          body=$(curl --fail --silent --show-error -X POST "$HOOK")
          echo "Web deploy triggered: $(echo "$body" | grep -o 'dep-[A-Za-z0-9]*' | head -n 1)"
