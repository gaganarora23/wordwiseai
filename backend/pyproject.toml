[project]
name = "wordwise-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.163.*",
    "psycopg[binary]==3.3.*",
    "pydantic-settings==2.16.*",
    "sqlalchemy==2.1.*",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
