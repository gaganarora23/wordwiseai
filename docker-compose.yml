services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set; copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set or empty; copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set; copy .env.example to .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data in a version-specific subdirectory of
      # /var/lib/postgresql, so mount the parent, not .../data.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  db_data:
